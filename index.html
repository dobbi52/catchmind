<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>픽셀 캐치마인드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#0B0F1A; --panel:#141A2E; --cell:#1C2340; --line:#2A3150; --line2:#3A4466;
  --text:#E8ECFF; --muted:#8A93C2;
  --green:#39FF88; --green-d:#1F6B45; --pink:#FF4FA3; --pink-d:#7A1F4F; --yellow:#FFE14D; --yellow-d:#7A6A1A;
  --pix:'Press Start 2P', monospace; --ko:'Do Hyeon', sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ko);min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,input,label{touch-action:manipulation}
body{min-height:100vh;min-height:100dvh}
button{font-family:var(--ko);color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input,textarea{font-family:var(--ko)}
.pix{font-family:var(--pix)}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* buttons */
.btn{border:none;padding:0 20px;height:52px;font-size:20px;background:var(--green);color:var(--bg);box-shadow:5px 5px 0 var(--green-d)}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:2px 2px 0 var(--green-d)}
.btn.pink{background:var(--pink);box-shadow:5px 5px 0 var(--pink-d)}
.btn.pink:active:not(:disabled){box-shadow:2px 2px 0 var(--pink-d)}
.btn.yellow{background:var(--yellow);box-shadow:5px 5px 0 var(--yellow-d)}
.btn.yellow:active:not(:disabled){box-shadow:2px 2px 0 var(--yellow-d)}
.btn.ghost{background:transparent;color:var(--text);border:3px solid var(--line2);box-shadow:none}
.btn.small{height:40px;font-size:17px;padding:0 14px}

/* logo */
.logo{display:flex;align-items:center;gap:14px}
.logo-mark{width:34px;height:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;flex:none}
.logo-mark i{display:block}
.logo-title{font-size:36px;line-height:1;color:var(--green)}
.logo-sub{font-family:var(--pix);font-size:9px;color:var(--muted);letter-spacing:2px;margin-top:6px}

/* panels */
.panel{background:var(--panel);border:4px solid var(--line2);padding:16px 18px}
.panel.g{border-color:var(--green)}
.panel.p{border-color:var(--pink)}
.panel.y{border-color:var(--yellow)}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tagpix{font-family:var(--pix);font-size:12px}

/* grid canvas */
.grid-wrap{background:var(--bg);padding:2px;width:100%;aspect-ratio:1/1;position:relative;touch-action:none}
.grid-wrap canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.grid-frame{border:4px solid var(--green)}

/* center screens */
.center{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:17px;color:var(--green)}
.inp{height:56px;padding:0 14px;border:3px solid var(--green);background:var(--panel);color:var(--text);font-size:22px;outline:none;width:100%;border-radius:0}
.inp:focus{border-color:var(--yellow)}
.inp.code{font-family:var(--pix);font-size:22px;letter-spacing:8px;text-align:center}
.err{color:var(--pink);font-size:17px;min-height:22px}
.home-btns{display:flex;flex-direction:column;gap:16px}
.home-btns .btn{height:72px;font-size:24px;display:flex;align-items:center;justify-content:space-between}
.home-btns .btn span.pix{font-size:11px}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.note{font-size:15px;color:var(--muted);line-height:1.5;border:2px dashed var(--line2);padding:10px 12px}

/* ====== BOARD (teacher) ====== */
.board{min-height:100vh;min-height:100dvh;padding:18px 28px;display:flex;flex-direction:column;gap:18px;max-width:1600px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{padding:10px 14px;border:3px solid var(--line2);font-family:var(--pix);font-size:12px}
.chip.code{border-color:var(--yellow);color:var(--yellow);display:flex;gap:10px;align-items:center}
.chip.code b{font-size:20px;letter-spacing:4px}
.chip.round{background:var(--pink);color:var(--bg);border-color:var(--pink)}
.b-main{display:flex;gap:26px;flex:1;min-height:0;flex-wrap:wrap;align-items:flex-start}
.b-left{flex:0 0 auto;width:min(46vw,560px,calc(100vh - 150px));width:min(46vw,560px,calc(100dvh - 150px));display:flex;flex-direction:column;gap:12px}
.b-right{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px}
.hintbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
.hint-cat{padding:3px 12px;background:var(--yellow);color:var(--bg);font-size:20px}
.hint-cat.off{background:transparent;color:var(--muted);border:2px dashed var(--line2)}
.letters{display:flex;gap:6px;align-items:flex-end}
.letters i{display:block;width:26px;height:6px;background:var(--green)}

.drawers{display:flex;gap:12px}
.dcard{flex:1;min-width:0;padding:12px;border:3px solid var(--line2);display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:space-between}
.dcard .nm{font-size:28px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard.done{color:var(--muted)}
.dcard.wait{border-style:dashed}
.dcard.now{background:var(--green);color:var(--bg);border-color:var(--green);flex:1.3}
.dcard .tm{font-family:var(--pix);font-size:24px}
.seg10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:10px}
.seg10 i{display:block;background:rgba(11,15,26,.25)}
.seg10 i.on{background:var(--bg)}
.seg10.y i{background:var(--line)}
.seg10.y i.on{background:var(--yellow)}

.rank-row{display:flex;align-items:center;gap:14px;height:32px}
.rank-row .r{width:56px;font-family:var(--pix);font-size:12px}
.rank-row .n{flex:1;font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .s{font-family:var(--pix);font-size:15px;color:var(--green)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* lobby */
.lobby{display:flex;gap:26px;flex-wrap:wrap}
.lobby-join{flex:0 0 auto;width:min(100%,380px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.qr{background:#fff;padding:10px;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:180px!important;height:180px!important;image-rendering:pixelated}
.bigcode{font-family:var(--pix);font-size:40px;color:var(--yellow);letter-spacing:10px}
.url{font-size:15px;color:var(--muted);word-break:break-all}
.lobby-right{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:20px}
.names{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.name-chip{padding:6px 12px;border:2px solid var(--green);font-size:20px}
.name-chip.off{border-color:var(--line2);color:var(--muted)}
.set-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 0;border-bottom:2px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .lb{width:110px;font-size:19px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;min-width:52px;padding:0 12px;background:transparent;border:3px solid var(--line2);font-size:18px}
.seg button.on{background:var(--green);color:var(--bg);border-color:var(--green)}
.ta{width:100%;min-height:96px;padding:10px;background:var(--bg);color:var(--text);border:3px solid var(--line2);font-size:18px;line-height:1.5;resize:vertical;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}

/* result & end */
.banner{background:var(--yellow);color:var(--bg);padding:20px 22px;box-shadow:6px 6px 0 var(--yellow-d);display:flex;align-items:center;justify-content:space-between;gap:12px}
.banner.miss{background:var(--panel);color:var(--text);border:4px solid var(--line2);box-shadow:none}
.banner .big{font-size:36px;line-height:1.1}
.banner .pts{font-family:var(--pix);font-size:30px}
.bonus-row{display:flex;align-items:center;gap:14px;height:40px;padding:0 14px;border:2px solid var(--line);margin-bottom:8px}
.bonus-row .t{width:70px;font-family:var(--pix);font-size:10px}
.bonus-row .n{flex:1;font-size:23px}
.bonus-row .s{font-family:var(--pix);font-size:13px;color:var(--green)}
.answer{display:flex;align-items:center;gap:14px;justify-content:center}
.answer b{font-size:46px;color:var(--yellow);font-weight:normal}
.podium{display:flex;gap:18px;align-items:flex-end;justify-content:center;margin:4px 0 2px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;width:170px}
.pod .nm{font-size:28px;text-align:center}
.pod .bar{width:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-family:var(--pix);font-size:22px;color:var(--bg)}
.wrong-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.wrong-row{display:flex;align-items:center;gap:10px;padding:6px 10px;border:2px solid var(--line)}
.wrong-row .w{flex:1;font-size:20px}
.wrong-row .who{color:var(--muted);font-size:16px}

/* ====== PLAYER (phone) ====== */
.phone{max-width:460px;margin:0 auto;padding:14px 16px 24px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px}
.p-top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:8px}
.p-time{font-family:var(--pix);font-size:20px;color:var(--yellow)}
.turn-tag{padding:8px 10px;background:var(--green);color:var(--bg);font-family:var(--pix);font-size:11px}
.secret{border:3px solid var(--pink);background:var(--panel);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.secret b{font-size:32px;color:var(--yellow);font-weight:normal;line-height:1}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.palette button{height:44px;border:2px solid var(--bg);padding:0}
.palette button.on{border:3px solid #fff;box-shadow:0 0 0 3px var(--pink)}
.tools{display:flex;gap:8px}
.tools .btn.ghost{font-size:17px}
.tools .btn{flex:1;height:48px;font-size:18px;padding:0 8px}
.tools .btn.ghost.on{border-color:var(--yellow);color:var(--yellow)}
.scorebar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:2px solid var(--line2)}
.lives{display:flex;gap:6px;align-items:center}
.misses{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:28px}
.miss-box{display:flex;flex-direction:column;gap:6px}
.miss-h{display:flex;align-items:baseline;gap:8px}
.misses{max-height:78px;overflow-y:auto}
.misses span.w{padding:2px 8px;border:2px solid var(--line2);color:var(--text);font-size:17px;display:inline-flex;align-items:baseline;gap:5px}
.misses span.w small{font-size:13px;color:var(--muted)}
.misses span.w.mine{border-color:var(--pink)}
.misses span.w.mine small{color:var(--pink)}
.guess-row{display:flex;gap:8px;align-items:flex-end}
.guess-row .field{flex:1}
.msg{font-size:20px;text-align:center;padding:12px;border:3px dashed var(--line2)}
.msg.ok{border-color:var(--green);color:var(--green)}
.msg.bad{border-color:var(--pink);color:var(--pink)}
.wait-big{font-size:28px;text-align:center;line-height:1.4}

/* 그림판 + 옆 칸 (폰: 위아래, 넓은 화면: 좌우) */
.play .p-side{display:contents}
.play .p-canvas{order:2}
.play .p-side > *{order:1}
.play .p-side > .after{order:3}
.play .spacer{display:none}
.p-title{font-size:20px}
.p-score{font-size:14px}
.p-note{text-align:center;font-size:16px}
.done-btn{height:52px;font-size:20px}
.hint-row{display:flex;align-items:center;justify-content:space-between;min-height:36px;gap:8px}
.p-letters{font-size:17px}
.miss-t{font-size:18px;color:var(--pink)}
.secret b.hid{color:var(--muted);letter-spacing:6px}
.peek{height:40px;padding:0 12px;background:transparent;border:3px solid var(--yellow);color:var(--yellow);font-size:17px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;white-space:nowrap}
.peek.on{background:var(--yellow);color:var(--bg)}
.peek.need{animation:needPulse .7s steps(2,start) infinite}
@keyframes needPulse{to{background:var(--yellow);color:var(--bg)}}
@media (min-width: 900px) and (min-aspect-ratio: 5/4){
  .phone.play{--cv:min(calc(100vh - 48px), 58vw);max-width:none;display:grid;grid-template-columns:var(--cv) minmax(340px,560px);justify-content:center;align-items:start;column-gap:32px;padding:24px 32px;min-height:100vh}
  .play .p-canvas{width:var(--cv);order:0;grid-column:1;grid-row:1}
  .play .p-side{order:0;grid-column:2;grid-row:1}
  .play .p-side{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 48px)}
  .play .spacer{display:block;flex:1}
  .play .p-title{font-size:28px}
  .play .p-time{font-size:28px}
  .play .p-score{font-size:18px}
  .play .scorebar{padding:12px 16px;border-width:3px}
  .play .secret{padding:14px 18px;border-width:4px}
  .play .secret b{font-size:44px}
  .play .palette{grid-template-columns:repeat(4,1fr);gap:10px}
  .play .palette button{height:56px}
  .play .tools .btn{height:52px;font-size:20px}
  .play .done-btn{height:64px;font-size:26px}
  .play .p-note{font-size:18px}
  .play .hint-row{padding:14px 16px;background:var(--panel);border:4px solid var(--yellow)}
  .play .hint-cat{font-size:24px}
  .play .p-letters{font-size:22px}
  .play .lives svg{width:28px;height:25px}
  .play .miss-box{flex:1;min-height:120px;padding:14px 16px;background:var(--panel);border:4px solid var(--pink)}
  .play .miss-t{font-size:24px}
  .play .misses{max-height:none;overflow:auto;flex:1;align-content:flex-start;align-items:flex-start}
  .play .misses span.w{font-size:21px}
  .play .inp{height:60px;font-size:24px}
}
@supports (height: 100dvh){
  @media (min-width: 900px) and (min-aspect-ratio: 5/4){
    .phone.play{--cv:min(calc(100dvh - 48px), 58vw);min-height:100dvh}
    .play .p-side{min-height:calc(100dvh - 48px)}
  }
}
.live{font-size:18px;text-align:center;padding:8px 12px;border:2px solid var(--line2);color:var(--muted);line-height:1.5}
.live b{font-family:var(--pix);font-size:15px;color:var(--green);font-weight:normal}
.live.warn{border-color:var(--yellow);color:var(--yellow)}
.live.warn b{color:var(--yellow)}
.live.full{border-color:var(--pink);color:var(--pink)}
.live.full b{color:var(--pink)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--yellow);color:var(--bg);padding:10px 16px;font-size:20px;z-index:50;box-shadow:4px 4px 0 var(--yellow-d)}
/* animations */
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.enter{animation:enter .36s steps(6) both}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .42s steps(6) both}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .36s steps(6)}
.urgent{color:var(--pink)!important;animation:blink .5s steps(2,start) infinite}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pod .bar{transform-origin:bottom;animation:grow .9s steps(9) both}
.pod:nth-child(1) .bar{animation-delay:.5s}.pod:nth-child(2) .bar{animation-delay:1s}.pod:nth-child(3) .bar{animation-delay:.1s}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(11,15,26,.9);z-index:40;pointer-events:none;animation:splash 1.7s steps(10) forwards;text-align:center;padding:16px}
@keyframes splash{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0;visibility:hidden}}
.splash .t1{font-family:var(--pix);font-size:clamp(20px,5vw,40px);animation:pop .5s steps(6) both}
.splash .t2{font-size:clamp(30px,7vw,64px);animation:pop .5s .15s steps(6) both}
.splash .bars{display:flex;gap:6px}
.splash .bars i{display:block;width:14px;height:14px;animation:blink .4s steps(2,start) infinite}
.splash .bars i:nth-child(2){animation-delay:.1s}.splash .bars i:nth-child(3){animation-delay:.2s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-20px;display:block;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.armed{background:var(--pink)!important;color:var(--bg)!important;border-color:var(--pink)!important}
.chip.bgm{background:transparent;color:var(--muted);cursor:pointer;font-family:var(--pix)}
.chip.bgm.on{border-color:var(--green);color:var(--green)}
@media (prefers-reduced-motion: reduce){
  .enter,.pop,.shake,.pod .bar,.splash .t1,.splash .t2{animation:none}
  .splash{animation:splash 1.7s steps(1) forwards}
  .confetti{display:none}
}
.modeflag{pointer-events:none;position:fixed;left:10px;bottom:6px;font-family:var(--pix);font-size:8px;color:var(--muted);opacity:.7}

@media (max-width: 900px){
  .board{padding:16px}
  .b-left{width:100%}
  .lobby-join{width:100%}
  .drawers{flex-wrap:wrap}
  .dcard{min-height:110px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="modeflag" class="modeflag"></div>

<script>

/* =========================================================
   2) 기본 제시어 (정답|동의어|동의어)
   ========================================================= */

function clone(v){ return v == null ? null : JSON.parse(JSON.stringify(v)); }
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function segs(p){ return p.split('/').filter(Boolean); }
function overlaps(a, b){ const x = segs(a), y = segs(b); const n = Math.min(x.length, y.length); for (let i = 0; i < n; i++) if (x[i] !== y[i]) return false; return true; }

function makeLocalBackend(memoryOnly){
  const KEY = 'pcm-local-db';
  let db = {};
  if (!memoryOnly) { try { db = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { db = {}; } }
  const ch = (!memoryOnly && 'BroadcastChannel' in window) ? new BroadcastChannel('pcm-local') : null;
  const subs = new Set();
  function getAt(p){ let o = db; for (const k of segs(p)) { if (o == null || typeof o !== 'object') return null; o = o[k]; } return o === undefined ? null : o; }
  function setAt(p, v){
    const ks = segs(p); if (!ks.length) { db = v || {}; return; }
    let o = db;
    for (let i = 0; i < ks.length - 1; i++) { if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v === null || v === undefined) delete o[last]; else o[last] = clone(v);
  }
  function notify(paths){ for (const s of subs) if (paths.some(p => overlaps(s.path, p))) { try { s.cb(clone(getAt(s.path))); } catch (e) { console.error(e); } } }
  function persist(){ if (memoryOnly) return; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  function apply(writes, broadcast){
    writes.forEach(([p, v]) => setAt(p, v));
    if (broadcast) { persist(); if (ch) ch.postMessage(writes); }
    notify(writes.map(w => w[0]));
  }
  if (ch) ch.onmessage = e => apply(e.data, false);
  return {
    mode: memoryOnly ? 'practice' : 'local',
    waitConnected: () => Promise.resolve(true),
    now: () => Date.now(),
    on(path, cb){ const s = { path, cb }; subs.add(s); setTimeout(() => { if (subs.has(s)) cb(clone(getAt(path))); }, 0); return () => subs.delete(s); },
    async get(path){ return clone(getAt(path)); },
    async set(path, v){ apply([[path, v]], true); },
    async update(path, obj){ apply(Object.keys(obj).map(k => [path + '/' + k, obj[k]]), true); },
    push(path, v){ const id = genId(); apply([[path + '/' + id, v]], true); return id; },
    async remove(path){ apply([[path, null]], true); },
    presence(path){ apply([[path, true]], true); this._pres = path; if (!memoryOnly) window.addEventListener('pagehide', () => { if (this._pres === path) apply([[path, false]], true); }); },
    unpresence(){ this._pres = null; }
  };
}

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

async function makeFirebaseBackend(cfg){
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  firebase.initializeApp(cfg);
  const d = firebase.database();
  let off = 0, connected = false, connCb = null; const waiters = [];
  d.ref('.info/serverTimeOffset').on('value', s => { off = s.val() || 0; });
  d.ref('.info/connected').on('value', s => {
    connected = !!s.val();
    if (connected) waiters.splice(0).forEach(f => f(true));
    if (connCb) connCb(connected);
  });
  return {
    mode: 'firebase',
    isConnected: () => connected,
    onConnChange(cb){ connCb = cb; },
    waitConnected(ms){ if (connected) return Promise.resolve(true); return new Promise(res => { const t = setTimeout(() => res(false), ms); waiters.push(v => { clearTimeout(t); res(v); }); }); },
    now: () => Date.now() + off,
    on(p, cb){ const r = d.ref(p); const h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    async get(p){ return (await d.ref(p).get()).val(); },
    set: (p, v) => d.ref(p).set(v),
    update: (p, o) => d.ref(p).update(o),
    push(p, v){ const r = d.ref(p).push(); r.set(v); return r.key; },
    remove: p => d.ref(p).remove(),
    presence(p){ const r = d.ref(p); this._pres = r; d.ref('.info/connected').on('value', s => { if (s.val() && this._pres === r) { r.onDisconnect().set(false); r.set(true); } }); },
    unpresence(){ if (this._pres) { const r = this._pres; this._pres = null; return r.onDisconnect().cancel(); } },
    /* 지금 접속 중인 사람 수 (무료 요금제 동시 접속 100명 확인용) */
    trackPresence(onCount){
      const me = d.ref('presence/' + genId());
      d.ref('.info/connected').on('value', s => { if (s.val()) { me.onDisconnect().remove(); me.set(firebase.database.ServerValue.TIMESTAMP).catch(() => {}); } });
      d.ref('presence').on('value', s => onCount(s.numChildren()), () => onCount(null));
    }
  };
}

/* 격자 그리기 */
function drawGrid(cv, px, n, active){
  if (!cv) return;
  const now = performance.now();
  if (cv._n !== n) { cv._prev = null; cv._fx = {}; cv._n = n; }
  if (cv._prev && px && cv._prev.length === px.length) {
    for (let i = 0; i < px.length; i++) if (px[i] !== cv._prev[i] && px[i] !== '0') cv._fx[i] = now;
  }
  cv._prev = px; cv._px = px; cv._active = active;
  renderGridNow(cv);
  if (Object.keys(cv._fx).length && !cv._raf) {
    const loop = () => { cv._raf = null; if (!cv.isConnected) return; renderGridNow(cv); if (Object.keys(cv._fx).length) cv._raf = requestAnimationFrame(loop); };
    cv._raf = requestAnimationFrame(loop);
  }
}
function renderGridNow(cv){
  const px = cv._px, n = cv._n, active = cv._active, fx = cv._fx || {};
  const now = performance.now();
  const rect = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const size = Math.max(10, Math.round(rect.width * dpr));
  if (cv.width !== size) { cv.width = size; cv.height = size; }
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0B0F1A'; ctx.fillRect(0, 0, size, size);
  const gap = Math.max(1, Math.round(size / n * 0.06));
  const cell = (size - gap * (n - 1)) / n;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    const i = r * n + c;
    const v = px ? (px.charCodeAt(i) - 48) : 0;
    const x = Math.round(c * (cell + gap)), y = Math.round(r * (cell + gap));
    if (fx[i] != null) {
      const t = (now - fx[i]) / 260;
      if (t >= 1) { delete fx[i]; }
      else {
        const st = Math.floor(t * 4) / 4;          /* 계단식(픽셀) 움직임 */
        ctx.fillStyle = COLORS[0]; ctx.fillRect(x, y, Math.ceil(cell), Math.ceil(cell));
        const k = 0.35 + 0.65 * st, sz = cell * (1 + 0.25 * (1 - st)) * k, off = (cell - sz) / 2;
        ctx.fillStyle = COLORS[v >= 0 && v < COLORS.length ? v : 0];
        ctx.fillRect(Math.round(x + off), Math.round(y + off), Math.ceil(sz), Math.ceil(sz));
        ctx.fillStyle = 'rgba(255,255,255,' + (0.55 * (1 - st)) + ')';
        ctx.fillRect(Math.round(x + off), Math.round(y + off), Math.ceil(sz), Math.ceil(sz));
        continue;
      }
    }
    ctx.fillStyle = COLORS[v >= 0 && v < COLORS.length ? v : 0];
    ctx.fillRect(x, y, Math.ceil(cell), Math.ceil(cell));
  }
  if (active) { ctx.strokeStyle = '#39FF88'; ctx.lineWidth = Math.max(2, dpr * 2); ctx.strokeRect(1, 1, size - 2, size - 2); }
}
function emptyPx(n){ return '0'.repeat(n * n); }

function confetti(){

  const box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');

/* 배경음악: 직접 만든 8비트 곡 (Web Audio로 실시간 연주) */
const MEL = [72,0,76,79,76,0,72,74, 76,0,72,69,72,0,76,77, 77,0,81,77,72,0,77,79, 79,0,74,71,74,76,79,0,
             84,0,79,76,79,0,84,83, 81,0,76,72,76,0,81,79, 77,81,79,77,74,77,76,74, 72,0,76,0,72,0,0,0];
const BASS = [48,55,48,55, 45,52,45,52, 41,48,41,48, 43,50,43,50, 48,55,48,55, 45,52,45,52, 41,48,43,50, 48,55,48,0];
const Music = {
  ctx: null, master: null, on: false, timer: null, step: 0, next: 0, noiseBuf: null,
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.06; this.master.connect(this.ctx.destination);
    const len = Math.floor(this.ctx.sampleRate * 0.05); this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  start(){ this.init(); if (!this.ctx) return; this.ctx.resume(); this.on = true; this.step = 0; this.next = this.ctx.currentTime + 0.06; clearInterval(this.timer); this.timer = setInterval(() => this.schedule(), 25); },
  stop(){ this.on = false; clearInterval(this.timer); },
  toggle(){ if (this.on) this.stop(); else this.start(); return this.on; },
  schedule(){
    const fast = S.state && S.state.phase === 'drawing' && S.state.turnEndsAt - B.now() < 5000;
    const spb = 60 / (fast ? 168 : 132) / 2;
    while (this.next < this.ctx.currentTime + 0.12) { this.play(this.step, this.next, spb); this.next += spb; this.step = (this.step + 1) % MEL.length; }
  },
  tone(type, midi, t, dur, vol){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  hat(t){ const s = this.ctx.createBufferSource(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000; s.buffer = this.noiseBuf; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); s.connect(f); f.connect(g); g.connect(this.master); s.start(t); },
  play(i, t, spb){
    if (MEL[i]) this.tone('square', MEL[i], t, spb * 0.85, 0.45);
    if (i % 2 === 0 && BASS[i / 2]) this.tone('triangle', BASS[i / 2], t, spb * 1.8, 0.9);
    if (i % 2 === 1) this.hat(t);
  }
};

const S = {
  code: null, role: null, pid: null, hostKey: null,
  meta: null, state: null, players: {}, canvas: null,
  myGuesses: {}, guessesAll: {},
  unsubs: [], guessUnsub: null, guessUnsub2: null, guessRound: null, practice: false,
  viewKey: '', tick: null,
  // host
  processed: new Set(), wrongs: [], showWrongs: false, used: {},
  // drawer
  localPx: null, color: 5, eraser: false, undo: [], drawing: false, lastCell: null, writeT: null
};
function players(){ return Object.entries(S.players || {}).map(([id, p]) => ({ id, ...p })); }
function onlinePlayers(){ return players().filter(p => p.online !== false); }
function nameOf(id){ return (S.players && S.players[id] && S.players[id].name) || '?'; }
function settings(){ return (S.meta && S.meta.settings) || defaultSettings(); }
function defaultSettings(){ return { grid: 12, turn: 20, drawers: 3, rounds: 8, hint: 'always', cats: ['동물', '과일·채소', '음식', '물건', '장소', '자연·날씨', '탈것'], custom: '', useCustom: false }; }
function roomPath(sub = ''){ return 'rooms/' + S.code + (sub ? '/' + sub : ''); }
function drawersArr(){ const d = S.state && S.state.drawers; if (!d) return []; return Array.isArray(d) ? d : Object.values(d); }
function roundTotal(){ return (S.state && S.state.total) || 0; }

function isHostLogic(){ return S.role === 'host' || S.practice; }
function clearSubs(){ S.unsubs.forEach(u => u()); S.unsubs = []; if (S.guessUnsub) { S.guessUnsub(); S.guessUnsub = null; } if (S.guessUnsub2) { S.guessUnsub2(); S.guessUnsub2 = null; } S.guessRound = null; clearInterval(S.tick); }

function subscribeRoom(){
  clearSubs();
  S.unsubs.push(B.on(roomPath('meta'), v => { S.meta = v; render(); }));
  S.unsubs.push(B.on(roomPath('state'), v => { S.state = v; onState(); render(); }));
  S.unsubs.push(B.on(roomPath('players'), v => { S.players = v || {}; render(); }));
  S.unsubs.push(B.on(roomPath('canvas'), v => { S.canvas = v; onCanvas(); }));
  S.tick = setInterval(onTick, 250);
}

function stateEffects(){
  const s = S.state; if (!s) return;
  const rk = s.phase + ':' + s.round;
  const tk = s.round + ':' + s.drawerIdx;
  const first = S._rk === undefined;
  if (rk !== S._rk) {
    const prev = S._rk; S._rk = rk;
    if (!first && s.phase === 'drawing') {
      const d = drawersArr();
      if (S.role === 'host') showSplash('ROUND ' + s.round, '이어 그리기 시작!', '#FFE14D');
      else if (d[0] === S.pid) showSplash('YOUR TURN', '내가 먼저 그려요!', '#39FF88');
      else if (d.includes(S.pid)) showSplash('ROUND ' + s.round, '그림 팀이 됐어요!', '#FF4FA3');
      else showSplash('ROUND ' + s.round, '그림을 보고 맞혀요!', '#FFE14D');
    }
    if (!first && s.phase === 'result' && s.winner) {
      const d = drawersArr();
      if (S.role === 'host' || s.winner.pid === S.pid || d.includes(S.pid)) setTimeout(confetti, 150);
    }
    S._tk = tk; return;
  }
  if (tk !== S._tk) {
    S._tk = tk;
    const d = drawersArr();
    if (s.phase === 'drawing' && S.role !== 'host' && d[s.drawerIdx] === S.pid && s.drawerIdx > 0) showSplash('YOUR TURN', '내 차례예요!', '#39FF88');
    if (s.phase === 'drawing' && s.drawerIdx >= d.length && d.length) showSplash('LAST CHANCE', '마지막 ' + FINAL_SEC + '초!', '#FF4FA3');
  }
}
function onState(){
  stateEffects();
  const r = S.state && S.state.round;
  if (r && r !== S.guessRound) {
    if (S.guessUnsub) S.guessUnsub();
    if (S.guessUnsub2) S.guessUnsub2();
    S.guessUnsub = S.guessUnsub2 = null;
    S.guessRound = r;
    S.myGuesses = {}; S.guessesAll = {};
    if (isHostLogic()) {
      S.processed = new Set(); S.wrongs = [];
      S.guessUnsub = B.on(roomPath('guesses/' + r), v => { S.guessesAll = v || {}; hostProcessGuesses(); });
    }
    if (S.role === 'player') {
      S.guessUnsub2 = B.on(roomPath('guesses/' + r), v => { S.roundGuesses = v || {}; S.myGuesses = (v && v[S.pid]) || {}; render(); updateMisses(); });
    }
  }
}

/* =========================================================
   6) 교사(진행) 로직
   ========================================================= */
function parseCustom(text){
  return String(text || '').split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const parts = l.split(/[,|/]/).map(x => x.trim()).filter(Boolean);
    return { word: parts[0], syn: parts.slice(1), cat: '' };
  }).filter(x => x.word);
}
function wordPool(){
  const st = settings();
  if (st.useCustom) { const c = parseCustom(st.custom); if (c.length) return c; }
  const picked = (st.cats || []).filter(c => WORDS[c]);
  const cats = (S.practice || !picked.length) ? CATS : picked;
  const pool = [];
  cats.forEach(cat => (WORDS[cat] || []).forEach(e => { const p = e.split('|'); if (!S.practice || ART[p[0]]) pool.push({ word: p[0], syn: p.slice(1), cat }); }));
  return pool;
}

async function createRoom(){
  let code = '';
  for (let i = 0; i < 20; i++) {
    code = String(Math.floor(1000 + Math.random() * 9000));
    const ex = await B.get('rooms/' + code + '/meta');
    if (!ex) break;
  }
  const hostKey = genId();
  S.code = code; S.role = 'host'; S.hostKey = hostKey;
  lsSet('pcm-host', JSON.stringify({ code, hostKey, at: Date.now() }));
  await B.set('rooms/' + code, {
    meta: { created: B.now(), hostKey, settings: defaultSettings() },
    state: { phase: 'lobby', round: 0 },
    canvas: { round: 0, px: emptyPx(12) }
  });
  history.replaceState(null, '', location.pathname + '?host=' + code);
  subscribeRoom();
}

async function resumeHost(code){
  const meta = await B.get('rooms/' + code + '/meta');
  let saved = null; try { saved = JSON.parse(lsGet('pcm-host') || 'null'); } catch (e) {}
  if (!meta || !saved || saved.code !== code || saved.hostKey !== meta.hostKey) return false;
  S.code = code; S.role = 'host'; S.hostKey = saved.hostKey;
  const used = await B.get('rooms/' + code + '/used'); S.used = used || {};
  subscribeRoom();
  return true;
}

/* 그리는 친구 수에 따라 고를 수 있는 한 사람 시간 */
const TURN_OPTS = { 1: [20, 30, 60], 2: [15, 20, 30], 3: [10, 15, 20] };
function turnOpts(n){ return TURN_OPTS[n] || TURN_OPTS[3]; }
function saveSetting(k, v){
  const upd = { [k]: v };
  if (k === 'drawers') { const opts = turnOpts(v); if (!opts.includes(settings().turn)) upd.turn = opts[1]; }
  const st = { ...settings(), ...upd };
  B.update(roomPath('meta/settings'), upd); S.meta = { ...S.meta, settings: st }; render(true);
}

async function startRound(){
  const st = settings();
  const online = onlinePlayers();
  if (online.length < 2) { toast('학생이 2명 이상 들어와야 시작할 수 있어요'); return; }
  const count = Math.max(1, Math.min(st.drawers, online.length - 1));
  const shuffled = online.slice().sort(() => Math.random() - 0.5).sort((a, b) => (a.drawn || 0) - (b.drawn || 0));
  const drawers = shuffled.slice(0, count).map(p => p.id);
  let pool = wordPool();
  let fresh = pool.filter(w => !S.used[norm(w.word)]);
  if (!fresh.length) { S.used = {}; B.remove(roomPath('used')); fresh = pool; }
  const pick = fresh[Math.floor(Math.random() * fresh.length)];
  S.used[norm(pick.word)] = true;
  const now = B.now();
  const round = ((S.state && S.state.round) || 0) + 1;
  const total = (count * st.turn + FINAL_SEC) * 1000;
  const upd = {};
  upd['state'] = { phase: 'drawing', round, word: pick.word, syn: pick.syn || [], cat: pick.cat || '', drawers, drawerIdx: 0, roundStart: now, turnEndsAt: now + st.turn * 1000, total, winner: null };
  upd['canvas'] = { round, px: emptyPx(st.grid) };
  upd['used/' + norm(pick.word)] = true;
  drawers.forEach(id => { upd['players/' + id + '/drawn'] = ((S.players[id] && S.players[id].drawn) || 0) + 1; });
  S.processed = new Set(); S.wrongs = []; S.showWrongs = false;
  await B.update(roomPath(), upd);
}

function hostAdvanceTurn(){
  const s = S.state; if (!s || s.phase !== 'drawing') return;
  const st = settings(); const d = drawersArr(); const now = B.now();
  if (s.drawerIdx < d.length - 1) { const k = s.drawerIdx + 1; B.update(roomPath('state'), { drawerIdx: k, turnEndsAt: now + st.turn * 1000, total: now + (st.turn * (d.length - k) + FINAL_SEC) * 1000 - s.roundStart }); }
  else if (s.drawerIdx === d.length - 1) B.update(roomPath('state'), { drawerIdx: d.length, turnEndsAt: now + FINAL_SEC * 1000, total: now + FINAL_SEC * 1000 - s.roundStart });
  else hostEndRound(null);
}

function isCorrect(text){
  const s = S.state; const t = norm(text); if (!t) return false;
  const answers = [s.word, ...((s.syn && (Array.isArray(s.syn) ? s.syn : Object.values(s.syn))) || [])].map(norm);
  return answers.includes(t);
}

function hostProcessGuesses(){
  const s = S.state; if (!s || s.phase !== 'drawing') return;
  const d = drawersArr();
  const all = [];
  Object.entries(S.guessesAll || {}).forEach(([pid, list]) => {
    if (d.includes(pid)) return;
    const arr = Object.entries(list || {}).map(([id, g]) => ({ id, pid, ...g })).sort((a, b) => a.at - b.at).slice(0, MAX_TRIES);
    arr.forEach((g, i) => all.push({ ...g, attempt: i + 1 }));
  });
  all.sort((a, b) => a.at - b.at);
  for (const g of all) {
    const key = g.pid + '/' + g.id;
    if (S.processed.has(key)) continue;
    S.processed.add(key);
    if (isCorrect(g.t)) { hostEndRound(g.pid, g.attempt, g.at); return; }
    S.wrongs.unshift({ pid: g.pid, t: g.t, attempt: g.attempt, at: g.at });
  }
  if (S.showWrongs) render(true);
}

function hostEndRound(pid, attempt, at){
  const s = S.state; if (!s || s.phase !== 'drawing') return;
  const now = at || B.now();
  const elapsed = Math.max(0, now - s.roundStart);
  const total = Math.max(1, s.total);
  const pts = pid ? Math.max(30, Math.round(100 - 70 * Math.min(1, elapsed / total))) : 0;
  const upd = {};
  upd['state/phase'] = 'result';
  upd['state/winner'] = pid ? { pid, name: nameOf(pid), points: pts, elapsed, attempt: attempt || 1 } : null;
  if (pid) {
    const ids = [pid, ...drawersArr()];
    ids.forEach(id => { if (S.players[id]) upd['players/' + id + '/score'] = (S.players[id].score || 0) + pts; });
  }
  B.update(roomPath(), upd);
}

function hostTick(){
  const s = S.state; if (!s) return;
  if (s.phase === 'drawing' && B.now() >= s.turnEndsAt) hostAdvanceTurn();
}

async function hostListenSkip(){
  S.unsubs.push(B.on(roomPath('skip'), v => {
    const s = S.state;
    if (v && s && s.phase === 'drawing' && v.round === s.round && v.idx === s.drawerIdx) { B.remove(roomPath('skip')); hostAdvanceTurn(); }
  }));
}

async function hostNewGame(){
  const upd = { state: { phase: 'lobby', round: 0 } };
  players().forEach(p => { upd['players/' + p.id + '/score'] = 0; upd['players/' + p.id + '/drawn'] = 0; });
  upd['guesses'] = null;
  await B.update(roomPath(), upd);
}

/* =========================================================
   7) 학생 로직
   ========================================================= */
async function joinRoom(code, name){
  const meta = await B.get('rooms/' + code + '/meta');
  if (!meta) return '방 코드를 찾을 수 없어요';
  const pl = (await B.get('rooms/' + code + '/players')) || {};
  let pid = pidGet(code);
  if (pid && pl[pid]) {
    if (name && pl[pid].name !== name) {
      if (Object.entries(pl).some(([id, p]) => id !== pid && p.name === name)) return '이미 같은 이름의 친구가 있어요';
      await B.update('rooms/' + code + '/players/' + pid, { name });
    }
  } else {
    if (Object.values(pl).some(p => p.name === name)) return '이미 같은 이름의 친구가 있어요';
    pid = genId();

}

function myTries(){ return Object.values(S.myGuesses || {}).sort((a, b) => a.at - b.at); }

function submitGuess(text){
  const s = S.state; if (!s || s.phase !== 'drawing') return;
  const t = String(text || '').trim(); if (!t) return;
  const tries = myTries();
  if (tries.length >= MAX_TRIES) return;
  if (tries.some(g => norm(g.t) === norm(t))) { toast('이미 냈던 답이에요'); return; }
  B.push(roomPath('guesses/' + s.round + '/' + S.pid), { t: t.slice(0, 20), at: B.now() });
}

function isMyTurn(){ const s = S.state; return s && s.phase === 'drawing' && drawersArr()[s.drawerIdx] === S.pid; }

function onCanvas(){
  const c = S.canvas;
  const mine = S.role === 'player' && isMyTurn();
  if (!mine || (!S.drawing && !S.myStrokes) || !S.localPx || (c && c.px && c.px.length !== S.localPx.length)) S.localPx = c && c.px;
  paintCanvases();
}
function paintCanvases(){
  const n = settings().grid;
  const px = (S.role === 'player' && isMyTurn() && S.localPx) ? S.localPx : (S.canvas && S.canvas.px);
  document.querySelectorAll('canvas[data-grid]').forEach(cv => drawGrid(cv, px && px.length === n * n ? px : emptyPx(n), n, cv.dataset.grid === 'edit'));
}

function writeCanvasSoon(force){
  clearTimeout(S.writeT);
  const go = () => { if (isMyTurn()) B.set(roomPath('canvas'), { round: S.state.round, px: S.localPx }); };
  if (force) go(); else S.writeT = setTimeout(go, 70);
}
function cellFromEvent(cv, e, n){
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (x < 0 || y < 0 || x >= 1 || y >= 1) return null;
  return { r: Math.floor(y * n), c: Math.floor(x * n) };
}
function paintCell(cell, n){
  if (!cell) return;
  const ch = S.eraser ? '0' : String(S.color);
  const i = cell.r * n + cell.c;
  if (S.localPx[i] === ch) return;
  S.localPx = S.localPx.slice(0, i) + ch + S.localPx.slice(i + 1);
}
function paintLine(a, b, n){
  if (!a) { paintCell(b, n); return; }
  let x0 = a.c, y0 = a.r; const x1 = b.c, y1 = b.r;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) { paintCell({ r: y0, c: x0 }, n); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function bindDrawing(cv){
  const n = settings().grid;
  cv.addEventListener('pointerdown', e => {
    if (!isMyTurn()) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    if (!S.localPx || S.localPx.length !== n * n) S.localPx = (S.canvas && S.canvas.px && S.canvas.px.length === n * n) ? S.canvas.px : emptyPx(n);
    S.undo.push(S.localPx); if (S.undo.length > 40) S.undo.shift();
    S.drawing = true; S.myStrokes = true;
    const cell = cellFromEvent(cv, e, n); S.lastCell = cell; paintCell(cell, n);
    paintCanvases(); writeCanvasSoon();
  });
  cv.addEventListener('pointermove', e => {
    if (!S.drawing || !isMyTurn()) return;
    e.preventDefault();
    const cell = cellFromEvent(cv, e, n); if (!cell) return;
    if (S.lastCell && cell.r === S.lastCell.r && cell.c === S.lastCell.c) return;
    paintLine(S.lastCell, cell, n); S.lastCell = cell;
    paintCanvases(); writeCanvasSoon();
  });
  const end = () => { if (!S.drawing) return; S.drawing = false; S.lastCell = null; writeCanvasSoon(true); };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
}

   7-1) 혼자 연습: 컴퓨터 친구
   ========================================================= */
const BOT_NAMES = ['픽셀봇', '도트봇', '비트봇'];
const BOT = { round: 0, info: {} };
const _artCells = {};
function artCells(word){
  if (_artCells[word]) return _artCells[word];
  const a = ART[word]; if (!a) return [];
  const cells = [];
  for (let i = 0; i < a.length; i++) if (a[i] !== '0') cells.push([i, a[i]]);
  return (_artCells[word] = cells);
}
function wrongWord(s){
  const list = (WORDS[s.cat] || []).map(e => e.split('|')[0]).filter(w => w !== s.word);
  const all = list.length ? list : Object.keys(ART).filter(w => w !== s.word);
  return all[Math.floor(Math.random() * all.length)];
}
async function setupPractice(name){
  B = makeLocalBackend(true);
  S.practice = true; S.code = 'PRAC'; S.role = 'player'; S.pid = 'me';
  $('#modeflag').textContent = 'PRACTICE · 컴퓨터 친구와 연습';
  const st = { ...defaultSettings(), turn: 15, drawers: 2, rounds: 5, cats: CATS };
  const pl = { me: { name, score: 0, drawn: 0, joined: 1, online: true } };
  BOT_NAMES.forEach((n, i) => { pl['bot' + i] = { name: n, bot: true, score: 0, drawn: 0, joined: 2 + i, online: true }; });
  await B.set('rooms/PRAC', { meta: { created: B.now(), hostKey: 'practice', settings: st }, state: { phase: 'lobby', round: 0 }, canvas: { round: 0, px: emptyPx(12) }, players: pl });
  subscribeRoom();
  hostListenSkip();
}
function botTick(){
  const s = S.state; if (!s || s.phase !== 'drawing') return;
  const now = B.now(); const d = drawersArr(); const st = settings(); const n = st.grid;
  if (BOT.round !== s.round) { BOT.round = s.round; BOT.info = {}; }
  const cells = artCells(s.word);
  /* 컴퓨터 친구가 그리는 차례 */
  const cur = d[s.drawerIdx];
  if (cur && S.players[cur] && S.players[cur].bot && cells.length) {
    const k = s.drawerIdx, D = d.length;
    const portion = cells.slice(Math.floor(k * cells.length / D), Math.floor((k + 1) * cells.length / D));
    const turnStart = s.turnEndsAt - st.turn * 1000;
    const f = (now - turnStart - 1200) / (st.turn * 1000 * 0.6);
    const cnt = Math.max(0, Math.min(portion.length, Math.ceil(f * portion.length)));
    const base = (S.canvas && S.canvas.px && S.canvas.px.length === n * n) ? S.canvas.px : emptyPx(n);
    const arr = base.split(''); let changed = false;
    for (let j = 0; j < cnt; j++) { const [i, ch] = portion[j]; if (arr[i] !== ch) { arr[i] = ch; changed = true; } }
    if (changed) B.set(roomPath('canvas'), { round: s.round, px: arr.join('') });
    if (f >= 1.25 && !BOT.info['done' + k]) { BOT.info['done' + k] = 1; hostAdvanceTurn(); return; }
  }
  /* 컴퓨터 친구가 맞히는 차례 */
  const e = (now - s.roundStart) / s.total;
  const painted = ((S.canvas && S.canvas.px) || '').replace(/0/g, '').length;
  const humanDrawing = d.includes(S.pid);
  const quality = humanDrawing ? Math.min(1, painted / 20) : (cells.length ? painted / cells.length : 0);
  players().filter(p => p.bot && !d.includes(p.id)).forEach(p => {
    const b = BOT.info[p.id] || (BOT.info[p.id] = { tries: 0, next: s.roundStart + s.total * (0.3 + 0.3 * Math.random()) });
    if (b.tries >= MAX_TRIES || now < b.next) return;
    b.next = now + s.total * (0.12 + 0.15 * Math.random());
    if (quality < 0.25) return;
    const pc = Math.max(0, Math.min(0.5, (e - 0.35) * 1.1)) * Math.min(1, quality);
    b.tries++;
    const right = Math.random() < pc;
    B.push(roomPath('guesses/' + s.round + '/' + p.id), { t: right ? s.word : wrongWord(s), at: now });
  });
}

/* ---------- 학생 화면 ---------- */
function renderPlayer(force){
  const s = S.state; if (!s || !S.meta) return;
  const me = S.players[S.pid];
  if (!me) { app.innerHTML = `<div class="center"><div class="card"><div class="msg bad">방에서 나가졌어요. 다시 들어와 주세요.</div><button class="btn" onclick="location.href=location.pathname+'?room=${esc(S.code)}'">다시 들어가기</button></div></div>`; S.viewKey = 'gone'; return; }
  const d = drawersArr();
  const amDrawer = d.includes(S.pid);
  const tries = myTries().length;
  const key = 'p:' + s.phase + ':' + (s.round || 0) + ':' + (s.drawerIdx ?? '') + ':' + amDrawer + ':' + tries + ':' + settings().grid + ':' + (s.phase === 'result' || s.phase === 'end' || s.phase === 'lobby' ? JSON.stringify(players().map(p => [p.id, p.name, p.score, p.online])) : '');
  if (!force && key === S.viewKey) return;
  const keepInput = $('#guessInput') && $('#guessInput').value;
  const hadFocus = document.activeElement && document.activeElement.id === 'guessInput';
  const pScreenChanged = key.split(':').slice(0, 3).join(':') !== S.viewKey.split(':').slice(0, 3).join(':');
  if (key.split(':').slice(0, 4).join(':') !== S.viewKey.split(':').slice(0, 4).join(':')) { S.myStrokes = false; S.undo = []; S.drawing = false; }
  S.viewKey = key;
  if (s.phase === 'lobby') app.innerHTML = playerLobbyHTML(me);
  else if (s.phase === 'drawing') app.innerHTML = amDrawer ? playerDrawerHTML() : playerGuesserHTML();
  else if (s.phase === 'result') app.innerHTML = playerResultHTML();
  else app.innerHTML = playerEndHTML();
  const cv = document.querySelector('canvas[data-grid="edit"]'); if (cv) bindDrawing(cv);
  const gi = $('#guessInput'); if (gi && keepInput && tries === S._lastTries) gi.value = keepInput;
  if (gi && hadFocus) gi.focus();
  updateMisses();
  if (s.phase === 'drawing' && amDrawer) { startAutoPeek(); applyPeek(); }
  if (pScreenChanged) animateEnter();
  if (s.phase === 'drawing' && S._lastTriesR === s.round && tries > (S._lastTriesN || 0)) {
    const lv = document.querySelector('.lives'); if (lv) lv.classList.add('shake');
    const gf = $('#guessForm'); if (gf) gf.classList.add('shake');
    toast('땡! 다시 생각해 봐요', 1200);
  }
  S._lastTriesR = s.round; S._lastTriesN = tries;
  if (s.phase === 'result') { const m = document.querySelector('.msg'); if (m) m.classList.add('pop'); }
  S._lastTries = tries;
  if (!(s.phase === 'drawing' && isMyTurn())) { S.localPx = S.canvas && S.canvas.px; }
  requestAnimationFrame(paintCanvases);
}

/* 제시어 가리기: 차례 처음 2초 보여주고, 그 뒤엔 꾹 누르는 동안만 */
function applyPeek(){
  const b = $('#secretWord'); if (!b) return;
  const now = Date.now();
  const auto = S._peekFrom && now >= S._peekFrom && now < S._peekUntil;
  const on = !!(auto || S._holding);
  b.textContent = on ? b.dataset.word : '???';
  b.classList.toggle('hid', !on);
  const btn = $('#peekBtn');
  if (btn) {
    btn.classList.toggle('on', on);
    btn.classList.toggle('need', !on && !S._peeked && S._peekUntil && now >= S._peekUntil);
    btn.textContent = auto ? '곧 가려져요' : '꾹 눌러 보기';
  }
}
function startAutoPeek(){
  const s = S.state;
  if (!s || S._autoPeekRound === s.round) return;
  S._autoPeekRound = s.round; S._peeked = false; S._holding = false;
  const delay = document.querySelector('.splash') ? 1600 : 200;
  S._peekFrom = Date.now() + delay; S._peekUntil = S._peekFrom + 2000;
  let first = false; try { first = !sessionStorage.getItem('pcm-peek-tip'); sessionStorage.setItem('pcm-peek-tip', '1'); } catch (e) {}
  if (first) setTimeout(() => toast('옆 친구가 못 보게 가리고, 꾹 눌러 확인해요', 2600), delay);
}
function updateMisses(){
  const box = $('#missList'); if (!box || !S.state || S.state.phase !== 'drawing') return;
  const d = drawersArr(); const list = [];
  Object.entries(S.roundGuesses || {}).forEach(([pid, gs]) => {
    if (d.includes(pid)) return;
    Object.values(gs || {}).sort((a, b) => a.at - b.at).slice(0, MAX_TRIES).forEach(g => { if (!isCorrect(g.t)) list.push({ pid, t: g.t, at: g.at }); });
  });
  list.sort((a, b) => b.at - a.at);
  box.innerHTML = list.length
    ? list.map(g => `<span class="w ${g.pid === S.pid ? 'mine' : ''}">${esc(g.t)}<small>${g.pid === S.pid ? '나' : esc(nameOf(g.pid))}</small></span>`).join('')
    : '<span class="muted" style="font-size:16px">아직 없어요</span>';
}
/* 처음 화면으로: 선생님은 방을 닫고, 학생은 방에서 나가요 */
async function goHome(){
  try {
    if (S.role === 'host') {
      if (S.state && S.state.phase !== 'lobby' && S.state.phase !== 'end' && !confirm('게임 중이에요. 방을 닫고 처음 화면으로 갈까요?')) return;
      if ((S.state && (S.state.phase === 'lobby' || S.state.phase === 'end')) && onlinePlayers().length && !confirm('방을 닫으면 들어온 학생들도 나가게 돼요. 처음 화면으로 갈까요?')) return;
      const path = roomPath(); clearSubs(); await B.remove(path); lsDel('pcm-host');
    } else if (S.role === 'player' && !S.practice) {
      const path = roomPath('players/' + S.pid); clearSubs();
      if (B.unpresence) await B.unpresence();
      await B.remove(path);
      try { pidStore().removeItem('pcm-pid-' + S.code); } catch (e) {}
    }
  } catch (e) { console.error(e); }
  location.href = location.pathname;
}

  if (tt) { tt.textContent = mmss(s.turnEndsAt - now); tt.classList.toggle('urgent', s.turnEndsAt - now <= 5000); }
  const seg = $('#turnSeg');
  if (seg) { const dur = (s.drawerIdx >= d.length ? FINAL_SEC : st.turn) * 1000; seg.innerHTML = seg10((s.turnEndsAt - now) / dur, S.role === 'player' ? 'y' : ''); }
  const rt = $('#roundTime');
  if (rt) { rt.textContent = mmss(s.roundStart + s.total - now); rt.classList.toggle('urgent', s.roundStart + s.total - now <= 5000); }
  const hc = $('#hintCat');
  if (hc) {
    const vis = catVisible();
    if (vis) { hc.textContent = s.cat; hc.classList.remove('off'); }
    else { hc.textContent = st.hint === 'half' && s.cat ? '곧 공개' : '???'; hc.classList.add('off'); }
    if (!s.cat) hc.textContent = st.useCustom ? '선생님 문제' : '???';
  }
}

/* =========================================================
   9) 클릭·입력
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.set) { saveSetting(t.dataset.set, JSON.parse(t.dataset.val)); return; }
  if (t.dataset.cat) {
    const st = settings(); let cats = (st.cats || []).slice();
    cats = cats.includes(t.dataset.cat) ? cats.filter(c => c !== t.dataset.cat) : [...cats, t.dataset.cat];
    if (!cats.length) { toast('분야를 하나 이상 골라 주세요'); return; }
    saveSetting('cats', cats); return;
  }
  if (t.dataset.color) { S.color = +t.dataset.color; S.eraser = false; document.querySelectorAll('.palette button').forEach(b => b.classList.toggle('on', b === t)); const er = document.querySelector('[data-act="eraser"]'); if (er) er.classList.remove('on'); return; }
  if (t.dataset.accept != null) { const w = S.wrongs[+t.dataset.accept]; if (w && confirm(`「${w.t}」를 정답으로 인정할까요?`)) hostEndRound(w.pid, w.attempt, w.at); return; }
  const act = t.dataset.act; if (!act) return;
  if (act === 'start' || act === 'next') { t.disabled = true; startRound(); }
  else if (act === 'skip') { if (confirm('정답을 공개하고 이번 라운드를 끝낼까요? (점수 없음)')) hostEndRound(null); }
  else if (act === 'end') { if (confirm('게임을 끝내고 최종 순위를 볼까요?')) B.update(roomPath('state'), { phase: 'end' }); }
  else if (act === 'newgame') { if (confirm('점수를 0으로 되돌리고 새 게임을 시작할까요?')) hostNewGame(); }
  else if (act === 'wrongs') { S.showWrongs = !S.showWrongs; render(true); }
  else if (act === 'gohome') { goHome(); }
  else if (act === 'pstart') { t.disabled = true; startRound(); }
  else if (act === 'pnext') { t.disabled = true; if (S.state.round >= settings().rounds) B.update(roomPath('state'), { phase: 'end' }); else startRound(); }
  else if (act === 'pagain') { t.disabled = true; hostNewGame().then(() => startRound()); }
  else if (act === 'phome') { location.href = location.pathname; }
  else if (act === 'clearall') {
    if (!isMyTurn()) return;
    if (!t.dataset.armed) {
      t.dataset.armed = '1'; t.textContent = '한 번 더!'; t.classList.add('armed');
      setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = '전체 지우기'; t.classList.remove('armed'); } }, 2000);
      return;
    }
    delete t.dataset.armed; t.textContent = '전체 지우기'; t.classList.remove('armed');
    const n = settings().grid;
    if (S.localPx) { S.undo.push(S.localPx); if (S.undo.length > 40) S.undo.shift(); }
    S.localPx = emptyPx(n); S.myStrokes = true;
    paintCanvases(); writeCanvasSoon(true); toast('모두 지웠어요. 되돌리기로 살릴 수 있어요', 1600);
  }
  else if (act === 'bgm') { const on = Music.toggle(); lsSet('pcm-bgm', on ? '1' : '0'); document.querySelectorAll('[data-act="bgm"]').forEach(b => { b.classList.toggle('on', on); b.textContent = on ? 'BGM ON' : 'BGM OFF'; b.setAttribute('aria-pressed', on); }); }
  else if (act === 'undo') { if (S.undo.length) { S.localPx = S.undo.pop(); paintCanvases(); writeCanvasSoon(true); } }
  else if (act === 'eraser') { S.eraser = !S.eraser; t.classList.toggle('on', S.eraser); document.querySelectorAll('.palette button').forEach(b => b.classList.toggle('on', !S.eraser && +b.dataset.color === S.color)); }
  else if (act === 'done') { if (isMyTurn()) { writeCanvasSoon(true); B.set(roomPath('skip'), { round: S.state.round, idx: S.state.drawerIdx, at: B.now() }); } }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'guessForm') { e.preventDefault(); const i = $('#guessInput'); submitGuess(i.value); i.value = ''; i.focus(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'custom') { clearTimeout(S._ct); const v = e.target.value; const cc = $('#customCount'); if (cc) cc.textContent = parseCustom(v).length; S._ct = setTimeout(() => { B.update(roomPath('meta/settings'), { custom: v }); S.meta.settings.custom = v; }, 400); }
});
window.addEventListener('resize', () => paintCanvases());
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('#peekBtn'); if (!b) return;
  e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (er) {}
  S._holding = true; S._peeked = true; S._peekUntil = Math.min(S._peekUntil || 0, Date.now()); applyPeek();
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { if (S._holding) { S._holding = false; applyPeek(); } }));
document.addEventListener('contextmenu', e => { if (e.target.closest('#peekBtn')) e.preventDefault(); });
document.addEventListener('keydown', e => { if (e.target.id === 'peekBtn' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); S._holding = true; S._peeked = true; applyPeek(); } });
document.addEventListener('keyup', e => { if (e.target.id === 'peekBtn' && (e.key === ' ' || e.key === 'Enter')) { S._holding = false; applyPeek(); } });

/* =========================================================
   10) 첫 화면
   ========================================================= */
function homeHTML(){
  let saved = null; try { saved = JSON.parse(lsGet('pcm-host') || 'null'); } catch (e) {}
  const recent = saved && Date.now() - saved.at < 6 * 3600 * 1000;
  return `<div class="center"><div class="card">
    <div style="display:flex;justify-content:center">${logoHTML()}</div>
    <div class="pix blink" style="text-align:center;font-size:12px;color:var(--yellow)">PRESS START</div>
    <div class="home-btns">
      ${S.offline ? '<div class="msg bad" style="font-size:18px">서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.<br>지금은 혼자 연습만 할 수 있어요.</div>' : ''}
      ${!S.offline && S.noConn ? `<div class="msg bad" style="font-size:18px">${NOCONN_MSG}</div>` : ''}
      <button class="btn" data-home="join" ${S.offline || S.noConn ? 'disabled' : ''}><span>학생 · 방 들어가기</span><span class="pix">PLAYER</span></button>
      <button class="btn pink" data-home="host" ${S.offline || S.noConn ? 'disabled' : ''}><span>선생님 · 방 만들기</span><span class="pix">HOST</span></button>
      <button class="btn yellow" data-home="practice"><span>혼자 연습 · 컴퓨터 친구와</span><span class="pix">1P</span></button>
      ${recent ? `<button class="btn ghost" data-home="resume"><span>만든 방 이어서 열기 (${esc(saved.code)})</span><span class="pix">CONT</span></button>` : ''}
    </div>
    <div class="live" data-live hidden></div>
    <div class="note">선생님은 전자칠판에서 방을 만들고, 학생은 휴대폰이나 노트북으로 들어와요. 뽑힌 친구 1~3명이 픽셀로 이어 그리고, 나머지는 정답을 맞혀요.</div>
  </div></div>`;
}

function joinHTML(code){
  return `<div class="center"><form class="card" id="joinForm" autocomplete="off">
    <div style="display:flex;justify-content:center">${logoHTML()}</div>
    <div class="pix" style="text-align:center;font-size:12px;color:var(--green)">INSERT COIN</div>
    <div class="field"><label for="jCode">방 코드</label><input id="jCode" class="inp code" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(code || '')}"></div>
    <div class="field"><label for="jName">별명 (2~8글자)</label><input id="jName" class="inp" maxlength="8" placeholder="예) 강낭콩" value="${esc(lsGet('pcm-name') || '')}"></div>
    <div class="err" id="jErr" role="alert"></div>
    <button class="btn" type="submit" style="height:60px;font-size:24px">입장하기 ▶</button>
    <button class="btn ghost small" type="button" data-home="back">처음으로</button>
  </form></div>`;
}

function practiceHTML(){
  return `<div class="center"><form class="card" id="practiceForm" autocomplete="off">
    <div style="display:flex;justify-content:center">${logoHTML()}</div>
    <div class="pix" style="text-align:center;font-size:12px;color:var(--yellow)">PRACTICE MODE</div>
    <div class="field"><label for="pName">별명 (2~8글자)</label><input id="pName" class="inp" maxlength="8" placeholder="예) 강낭콩" value="${esc(lsGet('pcm-name') || '')}"></div>
    <div class="err" id="pErr" role="alert"></div>
    <button class="btn yellow" type="submit" style="height:60px;font-size:24px">연습 시작 ▶</button>
    <button class="btn ghost small" type="button" data-home="back">처음으로</button>
  </form></div>`;
}
const NOCONN_MSG = '서버에 연결하지 못했어요. 인터넷 연결을 확인하고 잠시 뒤에 다시 해 주세요.<br>혼자 연습은 할 수 있어요.';
const NOCONN_TEXT = '서버에 연결하지 못했어요. 인터넷 연결을 확인하고 잠시 뒤에 다시 해 주세요.';
function onHomeScreen(){ return !S.code && !!document.querySelector('[data-home="practice"]'); }
function setNoConn(v){ if (S.noConn === v) return; S.noConn = v; if (onHomeScreen()) { app.innerHTML = homeHTML(); updateLive(); } }
function updateLive(){
  document.querySelectorAll('[data-live]').forEach(el => {
    const n = S.liveCount;
    if (n == null) { el.hidden = true; return; }
    el.hidden = false;
    el.className = 'live';
    el.innerHTML = `지금 <b>${n}</b>명이 접속해 있어요`;
  });
}
function showHome(){ S.code = null; app.innerHTML = homeHTML(); history.replaceState(null, '', location.pathname); updateLive(); }
function showJoin(code){ S.code = null; app.innerHTML = joinHTML(code); setTimeout(() => { const el = code ? $('#jName') : $('#jCode'); if (el) el.focus(); }, 50); }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-home]'); if (!t) return;
  const h = t.dataset.home;
  if (h === 'join') showJoin('');
  else if (h === 'practice') { app.innerHTML = practiceHTML(); setTimeout(() => { const el = $('#pName'); if (el) el.focus(); }, 50); }
  else if (h === 'back') showHome();
  else if (h === 'host') {
    t.disabled = true;
    if (!await B.waitConnected(6000)) { setNoConn(true); toast('지금은 방을 만들 수 없어요', 2200); return; }
    await createRoom(); hostListenSkip();
  }
  else if (h === 'resume') {
    if (!await B.waitConnected(6000)) { setNoConn(true); toast('지금은 방을 열 수 없어요', 2200); return; } let saved = null; try { saved = JSON.parse(lsGet('pcm-host') || 'null'); } catch (er) {} if (saved && await resumeHost(saved.code)) { hostListenSkip(); history.replaceState(null, '', location.pathname + '?host=' + saved.code); } else { toast('방을 찾을 수 없어요'); lsDel('pcm-host'); showHome(); } }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'practiceForm') return;
  e.preventDefault();
  const name = $('#pName').value.trim(); const err = $('#pErr');
  if ([...name].length < 2 || [...name].length > 8) { err.textContent = '별명은 2~8글자로 써 주세요'; return; }
  if (isBad(name)) { err.textContent = '다른 별명을 써 주세요'; return; }
  lsSet('pcm-name', name);
  await setupPractice(name);
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'joinForm') return;
  e.preventDefault();
  const code = $('#jCode').value.trim(), name = $('#jName').value.trim();
  const err = $('#jErr');
  if (!/^\d{4}$/.test(code)) { err.textContent = '방 코드 4자리를 입력해 주세요'; return; }
  if ([...name].length < 2 || [...name].length > 8) { err.textContent = '별명은 2~8글자로 써 주세요'; return; }
  if (isBad(name)) { err.textContent = '다른 별명을 써 주세요'; return; }
  err.textContent = '들어가는 중...';
  if (!await B.waitConnected(6000)) { err.innerHTML = NOCONN_TEXT; return; }
  const msg = await joinRoom(code, name);
  if (msg) err.textContent = msg;
});

(async function boot(){
  try {
    B = FIREBASE_CONFIG ? await makeFirebaseBackend(FIREBASE_CONFIG) : makeLocalBackend();
  } catch (e) {
    console.error(e);
    B = makeLocalBackend(true); S.offline = true;
    showHome(); return;
  }
  $('#modeflag').textContent = B.mode === 'local' ? 'DEMO MODE · 같은 브라우저 탭끼리만 연결' : '';
  if (B.trackPresence) B.trackPresence(n => { S.liveCount = n; updateLive(); });
  if (B.onConnChange) {
    B.onConnChange(c => { if (c) setNoConn(false); });
    setTimeout(() => { if (!B.isConnected()) setNoConn(true); }, 6000);
  }
  const q = new URLSearchParams(location.search);
  if ((q.get('host') || q.get('room')) && !await B.waitConnected(6000)) {
    if (q.get('room')) { showJoin(q.get('room')); const e = $('#jErr'); if (e) e.textContent = NOCONN_TEXT; }
    else { S.noConn = true; showHome(); }
    return;
  }
  if (q.get('host')) { if (await resumeHost(q.get('host'))) { hostListenSkip(); return; } showHome(); return; }
  if (q.get('room')) {
    const code = q.get('room');
    const pid = pidGet(code);
    const name = lsGet('pcm-name');
    if (pid && name) { const pl = await B.get('rooms/' + code + '/players/' + pid); if (pl) { const m = await joinRoom(code, pl.name); if (!m) return; } }
    showJoin(code); return;
  }
  showHome();
})();
</script>
</body>
</html>
